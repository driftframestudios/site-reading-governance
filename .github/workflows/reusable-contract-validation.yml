name: Reusable constellation contract validation

on:
  workflow_call:
    inputs:
      governance_repository:
        description: Owner and repository for the governance package
        required: true
        type: string
      governance_ref:
        description: Immutable governance commit SHA
        required: true
        type: string
      schema_name:
        description: Schema filename such as receipt.schema.json
        required: true
        type: string
      document_path:
        description: Caller-repository path to the JSON document
        required: true
        type: string
    secrets:
      governance_read_token:
        description: Fine-grained token with read access to the governance repository
        required: true

permissions:
  contents: read

jobs:
  contract-validation:
    name: contract-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - name: Check out pinned governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.governance_repository }}
          ref: ${{ inputs.governance_ref }}
          token: ${{ secrets.governance_read_token }}
          path: governance
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate pinned contract
        env:
          DOCUMENT_PATH: ${{ inputs.document_path }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: >-
          python3 governance/tools/validate_governance.py
          --governance-root governance
          --source-root source
          --schema-name "$SCHEMA_NAME"
          --document-path "$DOCUMENT_PATH"
