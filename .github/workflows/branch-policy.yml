name: Branch policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the base-controlled policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .branch-policy-base
          persist-credentials: false
          sparse-checkout: tools/check_branch_flow.py
          sparse-checkout-cone-mode: false

      - name: Check GitFlow-like branch coordinates
        working-directory: .branch-policy-base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >-
          python3 tools/check_branch_flow.py
          --base "$BASE_REF"
          --head "$HEAD_REF"
          --author "$PR_AUTHOR"
