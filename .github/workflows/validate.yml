name: Governance

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author-feedback:
    name: author-feedback (advisory)
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified Vale
        env:
          VALE_ARCHIVE: vale_3.15.2_Linux_64-bit.tar.gz
          VALE_SHA256: fc72e64454d6bd7af91905d4faebbf411bae3eec17bb572f4101311212bc0d9e
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$VALE_ARCHIVE" \
            "https://github.com/vale-cli/vale/releases/download/v3.15.2/$VALE_ARCHIVE"
          echo "$VALE_SHA256  $RUNNER_TEMP/$VALE_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale"
          tar --extract --gzip --file "$RUNNER_TEMP/$VALE_ARCHIVE" \
            --directory "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Review authored prose and comments
        continue-on-error: true
        run: >-
          vale --config=.vale.ini --no-global --no-exit
          --minAlertLevel=warning .

  governance-validation:
    name: governance-validation
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate contracts and examples
        run: python3 tools/validate_governance.py
      - name: Check negation-aware language
        run: python3 tools/check_language.py
      - name: Scan secret shapes with redacted findings
        run: python3 tools/scan_secret_shapes.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
