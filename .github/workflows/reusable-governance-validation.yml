name: Reusable governance validation

on:
  workflow_call:
    inputs:
      package_path:
        description: Repository-relative path to the governance package
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  governance-validation:
    name: governance-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.package_path }}
    steps:
      - name: Check out caller source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate governance package
        run: |
          python3 tools/validate_governance.py
          python3 tools/check_language.py
          python3 -m unittest discover -s tests -v
      - name: Check GitFlow-like pull-request coordinates
        run: >-
          python3 tools/check_branch_flow.py
          --base "${{ github.base_ref }}"
          --head "${{ github.head_ref }}"
