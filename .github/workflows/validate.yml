name: Governance

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-validation:
    name: governance-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate contracts and examples
        run: python3 tools/validate_governance.py
      - name: Check negation-aware language
        run: python3 tools/check_language.py
      - name: Scan secret shapes with redacted findings
        run: python3 tools/scan_secret_shapes.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check GitFlow-like pull-request coordinates
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          python3 tools/check_branch_flow.py
          --base "$BASE_REF"
          --head "$HEAD_REF"
