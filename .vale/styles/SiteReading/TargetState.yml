extends: existence
message: "Check which action the reader can take. Keep a necessary boundary and name the available action nearby."
level: warning
nonword: true
scope:
  - paragraph
  - comment
# Vale joins raw fragments into one expression. Each branch matches a visible wording cue.
raw:
  - '(?i)\A\s*(?:(?:do\s+not|don[''’]t|never|avoid)\b|\p{L}[^,.;:!?\n]{0,72}?\s+(?:must|should)\s+not\b)[^,.;:!?\n]*[.!?]?\s*\z'
  - '|(?i)\b(?:recovery path|safe path|replacement behavior)\s+is\s+(?:documented|described|specified)\s+(?:somewhere|elsewhere)\s*[.!?]?\s*\z'
