name: Reusable constellation contract validation

on:
  workflow_call:
    inputs:
      governance_repository:
        description: Owner and repository for the governance package
        required: true
        type: string
      governance_ref:
        description: Immutable governance commit SHA
        required: true
        type: string
      schema_name:
        description: Maintained schema filename such as data-contract.schema.json
        required: true
        type: string
      document_path:
        description: Caller-repository path to the JSON document
        required: true
        type: string
    secrets:
      governance_read_token:
        description: Fine-grained token with read access to the governance repository
        required: true

permissions:
  contents: read

jobs:
  contract-validation:
    name: contract-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - name: Validate immutable governance coordinate
        shell: bash
        env:
          GOVERNANCE_REPOSITORY: ${{ inputs.governance_repository }}
          GOVERNANCE_REF: ${{ inputs.governance_ref }}
        run: |
          case "$GOVERNANCE_REPOSITORY" in
            driftframestudios/site-reading-governance) ;;
            *)
              echo "Governance repository is outside the approved allowlist."
              exit 2
              ;;
          esac
          if [[ ! "$GOVERNANCE_REF" =~ ^[0-9a-f]{40}$ || \
                "$GOVERNANCE_REF" == "0000000000000000000000000000000000000000" ]]; then
            echo "Governance ref requires one nonzero immutable 40-hex commit."
            exit 2
          fi
      - name: Check out pinned governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.governance_repository }}
          ref: ${{ inputs.governance_ref }}
          token: ${{ secrets.governance_read_token }}
          path: governance
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: governance/requirements-dev.txt
      - name: Install the standard JSON Schema validator
        run: python3 -m pip install --requirement governance/requirements-dev.txt
      - name: Validate pinned contract
        env:
          DOCUMENT_PATH: ${{ inputs.document_path }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: >-
          python3 governance/tools/validate_governance.py
          --governance-root governance
          --source-root source
          --schema-name "$SCHEMA_NAME"
          --document-path "$DOCUMENT_PATH"
