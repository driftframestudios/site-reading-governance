name: Governance

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-validation:
    name: governance-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate contracts and examples
        run: python3 tools/validate_governance.py
      - name: Check negation-aware language
        run: python3 tools/check_language.py
      - name: Scan secret shapes with redacted findings
        run: python3 tools/scan_secret_shapes.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
