name: Reusable governance validation

on:
  workflow_call:
    inputs:
      package_path:
        description: Repository-relative path to the governance package
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  governance-validation:
    name: governance-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: ""
      - name: Validate bounded governance package
        shell: bash
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          if [[ ! "$PACKAGE_PATH" =~ ^(\.|[A-Za-z0-9][A-Za-z0-9._/-]*)$ ]]; then
            echo "Package path is outside the repository-relative grammar."
            exit 2
          fi
          if [[ "$PACKAGE_PATH" != "." && (
            "/$PACKAGE_PATH/" == *"/../"* ||
            "/$PACKAGE_PATH/" == *"/./"* ||
            "/$PACKAGE_PATH/" == *"//"*
          ) ]]; then
            echo "Package path contains a non-canonical segment."
            exit 2
          fi
          package_root="$(realpath -m -- "$GITHUB_WORKSPACE/$PACKAGE_PATH")"
          case "$package_root/" in
            "$GITHUB_WORKSPACE/"*) ;;
            *)
              echo "Package path resolves outside the checked-out repository."
              exit 2
              ;;
          esac
          cd -- "$package_root"
          python3 tools/validate_governance.py
          python3 tools/check_language.py
          python3 tools/scan_secret_shapes.py
          python3 -m unittest discover -s tests -v
